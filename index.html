<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="https://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4ff;
            padding: 40px 0;
        }
        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .form-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .form-title h3 {
            font-weight: 600;
            color: #2c3e7a;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .form-title p {
            color: #888;
            font-size: 13px;
            margin: 0;
        }
        .divider {
            border: none;
            border-top: 2px solid #f0f4ff;
            margin-bottom: 25px;
        }
        label {
            font-size: 13px;
            font-weight: 500;
            color: #444;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #dde3f0;
            font-size: 13px;
            height: 40px;
            font-family: 'Poppins', sans-serif;
        }
        .form-control:focus {
            border-color: #4a5fc1;
            box-shadow: 0 0 0 3px rgba(74,95,193,0.1);
        }
        .form-control:disabled {
            background-color: #f8f9fc;
            cursor: not-allowed;
        }
        .btn-area {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            padding: 9px;
            border: none;
        }
        .btn-save {
            background-color: #4a5fc1;
            color: white;
        }
        .btn-save:hover:not(:disabled) {
            background-color: #3a4fb1;
            color: white;
        }
        .btn-update {
            background-color: #f39c12;
            color: white;
        }
        .btn-update:hover:not(:disabled) {
            background-color: #e08e0b;
            color: white;
        }
        .btn-reset {
            background-color: #ecf0f1;
            color: #555;
        }
        .btn-reset:hover:not(:disabled) {
            background-color: #dde3e8;
            color: #333;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        #statusMsg {
            margin-top: 15px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            padding: 10px 15px;
        }
        .powered {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #aaa;
        }
        .powered span {
            color: #4a5fc1;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="form-box">
                <div class="form-title">
                    <h3>Student Enrollment Form</h3>
                    <p>Enter Roll No to save or update student record</p>
                </div>
                <hr class="divider">

                <div class="form-group">
                    <label>Roll No</label>
                    <input type="text" class="form-control" id="rollNo" 
                           placeholder="Enter Roll No">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" id="fullName" 
                           placeholder="Enter Full Name" disabled>
                </div>
                <div class="form-group">
                    <label>Class</label>
                    <input type="text" class="form-control" id="class" 
                           placeholder="e.g. SE Computer" disabled>
                </div>
                <div class="form-group">
                    <label>Birth Date</label>
                    <input type="date" class="form-control" id="birthDate" disabled>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" class="form-control" id="address" 
                           placeholder="Enter Address" disabled>
                </div>
                <div class="form-group">
                    <label>Enrollment Date</label>
                    <input type="date" class="form-control" id="enrollDate" disabled>
                </div>

                <div class="btn-area">
                    <button class="btn btn-save" id="saveBtn" 
                            onclick="saveData()" disabled>Save</button>
                    <button class="btn btn-update" id="updateBtn" 
                            onclick="updateData()" disabled>Update</button>
                    <button class="btn btn-reset" id="resetBtn" 
                            onclick="resetForm()" disabled>Reset</button>
                </div>

                <div id="statusMsg" class="alert"></div>
            </div>
            <div class="powered">Powered by <span>JsonPowerDB</span> — Login2Xplore</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
